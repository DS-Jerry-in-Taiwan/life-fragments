# Deploy ring-letter to Cloudflare when main changes: apply new D1
# migrations, then deploy the Worker to ringletter.wetrytrysee.cc.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Runtime secrets (ADMIN_EMAILS, ACCESS_*) live on the Worker and are kept
# across deploys; they are not managed here.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "ring-letter/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: ring-letter

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ringletter.wetrytrysee.cc
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ring-letter/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:auth
      - run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ring-letter-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Smoke test
        run: |
          curl -sf -o /dev/null https://ringletter.wetrytrysee.cc/
          code=$(curl -s -o /dev/null -w '%{http_code}' https://ringletter.wetrytrysee.cc/api/admin/queue)
          test "$code" = 302 || { echo "/api/admin/queue returned $code, expected Access redirect"; exit 1; }
