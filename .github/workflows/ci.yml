# PR checks for ring-letter: typecheck, unit tests, build, the API
# integration and retention tests and the Playwright e2e run, each against `npm run dev`
# with a fresh local D1.
# No Cloudflare credentials are used here.
name: CI

on:
  pull_request:
    paths:
      - "ring-letter/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ring-letter

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ring-letter/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:auth
      - run: npm run build

      - name: API integration and retention tests
        run: |
          npm run db:migrate:local
          # Bind IPv4 explicitly: on the runner `localhost` resolves to ::1,
          # but tests/api.mjs talks to 127.0.0.1.
          npm run dev -- --hostname 127.0.0.1 > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5173/ && break
            sleep 2
          done
          npm run test:api || { echo "--- dev server log"; cat dev.log; exit 1; }
          # Fires the Cron Trigger with future times; wipes the local D1's
          # non-approved rows, so it runs last.
          npm run test:retention || { echo "--- dev server log"; cat dev.log; exit 1; }

  # Browser smoke + screenshot comparison (issue #4, V1-a). Playwright runs in
  # the official container so the pixels match the committed baselines,
  # which are generated in the same image (`npm run test:e2e:update`).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ring-letter/package-lock.json

      - run: npm ci

      - name: Start dev server
        run: |
          npm run db:migrate:local
          npm run dev -- --hostname 127.0.0.1 > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5173/ && break
            sleep 2
          done

      - name: Playwright smoke + visual
        run: npm run test:e2e || { echo "--- dev server log"; cat dev.log; exit 1; }

      - name: Upload Playwright report and diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ring-letter/playwright-report/
            ring-letter/test-results/
          retention-days: 14
